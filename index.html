<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaSPOT</title>
    <link rel="icon" type="image/png" href="/logo_fape.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f4;
        --color-background-tertiary: #eeece8;
        --color-background-success: #e1f5ee;
        --color-background-warning: #faeeda;
        --color-background-info: #e6f1fb;
        --color-text-primary: #1a1a18;
        --color-text-secondary: #5f5e5a;
        --color-text-tertiary: #888780;
        --color-text-success: #0f6e56;
        --color-text-warning: #854f0b;
        --color-text-info: #185fa5;
        --color-text-danger: #a32d2d;
        --color-border-tertiary: rgba(0,0,0,0.10);
        --color-border-secondary: rgba(0,0,0,0.18);
        --color-border-primary: rgba(0,0,0,0.28);
        --color-border-success: #0f6e56;
        --font-mono: 'SF Mono', 'Fira Code', monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-primary: #1c1c1a;
          --color-background-secondary: #262624;
          --color-background-tertiary: #141412;
          --color-background-success: #04342c;
          --color-background-warning: #412402;
          --color-background-info: #042c53;
          --color-text-primary: #e8e6df;
          --color-text-secondary: #b4b2a9;
          --color-text-tertiary: #888780;
          --color-text-success: #5dcaa5;
          --color-text-warning: #ef9f27;
          --color-text-info: #85b7eb;
          --color-text-danger: #f09595;
          --color-border-tertiary: rgba(255,255,255,0.10);
          --color-border-secondary: rgba(255,255,255,0.18);
          --color-border-primary: rgba(255,255,255,0.28);
          --color-border-success: #5dcaa5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
